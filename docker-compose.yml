services:
  # 1. Reverse Proxy & Static PWA Server (Caddy)
  caddy:
    image: caddy:2-alpine
    container_name: kasirku_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/dist:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  # 2. FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kasirku_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://kasirku_user:kasirku_pass@db:5432/kasirku_db
      - KUNCI_RAHASIA=kasirku-kunci-rahasia-super-aman-2026-prod-jwt-secret-xyz987
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 3. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: kasirku_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=kasirku_user
      - POSTGRES_PASSWORD=kasirku_pass
      - POSTGRES_DB=kasirku_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasirku_user -d kasirku_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  db_data:
  caddy_data:
  caddy_config:
